name: Daily Japanese History Podcast

on:
  schedule:
    # UTC 20:15 = 日本時間 翌朝 05:15（遅延を見込んで早めに設定）
    - cron: "15 20 * * *"
  workflow_dispatch: # 手動テスト実行用

permissions:
  contents: write

jobs:
  build-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate episode & RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python main.py

      - name: Commit & Push to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ history.json
          git commit -m "Add episode $(date +'%Y-%m-%d')" || exit 0
          git push
